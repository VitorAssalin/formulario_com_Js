<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg custom-navbar" data-bs-theme="dark" aria-label="Navegação principal">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#"><i class="bi bi-mortarboard-fill me-2"
                        aria-hidden="true"></i>Claretiano Web</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false" aria-label="Alternar navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Cursos</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Inscrição</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Contatos</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <h1> Cadastro de Aluno </h1>
        <p class="formato1 text-center"> Preencha os campos para validar a sua inscrição</p>
    </header>
    <main class="container">
        <form name="formulario" id="formAluno" action="#" method="post">
            <div id="mensagemAlerta" class="my-3"></div>
            <fieldset>
                <legend class="float-none w-auto">Dados Pessoais</legend>
                <div class="mb-3">
                    <label for="ra" class="form-label labelpersonalizar">RA:</label>
                    <input type="text" name="ra" id="ra" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="nome" class="form-label labelpersonalizar">Nome:</label>
                    <input type="text" name="nome" id="nome" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label labelpersonalizar">Senha:</label>
                    <input type="password" name="senha" id="senha" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label labelpersonalizar">Email:</label>
                    <input type="email" name="email" id="email" class="form-control">
                </div>


            </fieldset>

            <fieldset>

                <legend class="float-none w-auto" id="legendaOpcoes">Opções Acadêmicas</legend>
                <div class="mb-3">
                    <label for="curso" class="form-label labelpersonalizar">Curso</label>
                    <select name="curso" id="curso" class="form-select">
                        <option value="">--Selecione--</option>
                        <option value="ADS">Análise e Desenvolvimento de Sistemas</option>
                        <option value="SI">Sistemas da Informação</option>
                    </select>
                </div>
                <fieldset class="border-0 p-0 mb-3">
                    <legend class="float-none w-autolabelpersonalizar fs-6 mb-2">Turno:</legend>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="turno" id="manha" value="Manhã" checked>
                        <label class="form-check-label" for="manha">Manhã</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="turno" id="noite" value="Noite">
                        <label class="form-check-label" for="noite">Noite</label>
                    </div>
                </fieldset>
                <div class="mb-3 form-check">
                    <input class="form-check-input" type="checkbox" name="notificacoes" id="notificacoes">
                    <label class="form-check-label" for="notificacoes">Receber notificações por e-mail</label>
                </div>

                <div class="mb-3">
                    <label class="form-label labelpersonalizar" for="obs">Observações</label>
                    <textarea name="obs" id="obs" rows="4" cols="50" class="form-control"></textarea>
                </div>
            </fieldset>
            <button type="submit" class="btn btn-roxo"><i class="bi bi-send me-1"></i>Enviar</button>
            <button type="reset" class="btn btn-secondary"><i class="bi bi-eraser me-1"></i>Limpar</button>
            <button type="button" class="btn btn-info" onclick="alert('Olá!próxima aula teremos JS!')"><i
                    class="bi bi-lightning-charge me-1"></i>Ação JS</button>

        </form>
    </main>
    <footer class="rodape text-center text-white py-4 mt-5">
        <div class="container">
            <p class="mb-1"><i class="bi bi-mortarboard-fill me-2"></i>Claretiano WEB</p>
            <p class="mb-0">Dúvidas? Acesse o <a href="#">portal do aluno</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
